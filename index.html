<title>Conference Certificate Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #eef1f5; color: #10203a;

    display: flex; justify-content: center; min-height: 100vh;
  }
  .wrap { width: min(1100px, 100%); padding: 24px; }
  .panel {
    background: white; border-radius: 14px; padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.10); margin-bottom: 20px;
  }

  p { margin: 0 0 16px; color: #526071; }

    flex: 1 1 420px; padding: 14px 16px; font-size: 18px;
    border: 1px solid #c9d0da; border-radius: 8px;
  }
  button {
    padding: 14px 20px; border: 0; border-radius: 8px;
    background: #0b1f3a; color: white; font-size: 16px;
    cursor: pointer;
  }
  button:hover { opacity:.92; }
  .stage {
    background: #dfe4ea; padding: 12px; border-radius: 10px;
    overflow:auto; text-align:center;
  }
  canvas { max-width: 100%; height: auto; display:block; margin:auto; }
  .note { font-size:13px; margin-top:10px; color:#6b7280; }
</style>
</head>
<body>

  </div>
  <div class="panel stage">
    <canvas id="canvas"></canvas>
  </div>
</div>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const input = document.getElementById("name");

function fitFont(text, maxWidth, startSize) {
  let size = startSize;
  while (size > 20) {
    ctx.font = `600 ${size}px Georgia, "Times New Roman", serif`;
    if (ctx.measureText(text).width <= maxWidth) return size;
    size -= 1;
  }
  return size;
}

function render() {
  if (!img.complete) return;
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  ctx.drawImage(img, 0, 0);

  const name = input.value.trim();
  if (!name) return;

  // Name position: centered in the blank area between
  // "This is to certify that" and "Has successfully attended the workshop".
  const maxWidth = canvas.width * 0.70;
  const fontSize = fitFont(name, maxWidth, Math.round(canvas.width * 0.039));
  ctx.font = `600 ${fontSize}px Georgia, "Times New Roman", serif`;
  ctx.fillStyle = "#0b2348";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(name, canvas.width / 2, canvas.height * 0.545);
}

img.onload = render;
input.addEventListener("input", render);

document.getElementById("download").addEventListener("click", () => {
  const name = input.value.trim();
  if (!name) {
    alert("Please enter the attendee's name first.");
    input.focus();
    return;
  }
  render();
  const safe = name.replace(/[^a-z0-9]+/gi, "_").replace(/^_+|_+$/g, "") || "Attendee";
  canvas.toBlob((blob) => {
    if (!blob) {
      alert("Could not create the certificate. Please try again.");
      return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `Certificate_${safe}.png`;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    setTimeout(() => {
      link.remove();
      URL.revokeObjectURL(url);
    }, 1500);
  }, "image/png");
});
</script>
